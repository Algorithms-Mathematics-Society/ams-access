[package]
name = "ams-access"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "ams_access_lib"
doctest = false
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ams-access"
path = "src/main.rs"

[dependencies]
# NOTE: the "devtools" feature is intentionally NOT enabled. Tauri turns
# DevTools on automatically for debug builds, so `pnpm tauri dev` still has
# them — but enabling the feature would also compile DevTools into RELEASE
# (lockdown) builds, letting a candidate open the inspector and drive
# window.__TAURI__ directly. Keep it off so release bundles ship without it.
tauri = { version = "2" }
platform-rs = { path = "../../../packages/platform-rs" }
core-rs = { path = "../../../packages/core-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "time"] }
# Event-stream uploader (organizer visibility). reqwest is already in the
# dependency graph via tauri, so this adds no new transitive deps.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
# RFC 9110 Date-header parsing for the clock-skew probe (zero dependencies).
httpdate = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_22"] }

[target.'cfg(target_os = "windows")'.dependencies]
# WebView2 PermissionRequested auto-allow for camera/mic. Same version wry
# already pins, so this adds no new transitive deps.
webview2-com = "0.38"

[build-dependencies]
tauri-build = { version = "2", features = [] }
