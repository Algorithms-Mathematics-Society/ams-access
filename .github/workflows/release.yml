name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-22.04
    name: Release source gate
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag name is release metadata, not the bundle version source. Require
      # it to describe the exact workspace version before any platform starts
      # an expensive build or can upload an asset.
      - name: Verify manifests and release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm check:versions

      - name: Test JavaScript and TypeScript packages
        run: |
          pnpm test
          pnpm typecheck

  build:
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # Both macOS targets build on macos-latest. GitHub retired the
          # macos-13 Intel runners, and a job pinned to that label queues for
          # 24h and then cancels the whole run — that killed v1.0.3 and
          # v1.0.4. The Intel slice cross-compiles on the arm64 runner.
          #
          # These were parked while notarization returned 403 ("A required
          # agreement is missing or has expired"), because an unnotarized .dmg
          # is worse than none: Gatekeeper refuses to open it at all. They are
          # restored here together with the certificate import. If the
          # agreement is still outstanding the notarize step fails loudly on
          # macOS and `fail-fast: false` leaves the Linux and Windows
          # artifacts intact, so a blocked Apple account costs a red job
          # rather than a release.
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.target }})

    # Job level, not step level: a step's own `env:` block is not in scope for
    # that step's `if:`, so gating the import on it would silently never run.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must match ci.yml and the root `engines.node` (>=22.6.0). This was
          # pinned to 20, which cannot run the test suite at all
          # (--experimental-strip-types arrived in 22.6).
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            rpm cpio squashfs-tools \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Turbo cache restore
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ matrix.platform }}-turbo-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ matrix.platform }}-turbo-

      # No NEXT_PUBLIC_API_URL. `resolveApiBase()` already returns the
      # production host as its own constant, and that constant is the one the
      # CSP allows and the one `csp-allows-api-base.test.mjs` verifies.
      #
      # A repository secret here can only override that with something else —
      # and it did. The secret predated the move off Cloud Run, so release
      # builds baked a dead host while every test passed, because tests run
      # without the secret and `tauri dev` uses the permissive devCsp. The
      # symptom was "Cannot reach the exam server" on a fresh install, with a
      # working API and correct credentials.
      #
      # One source of truth, in code, next to the comment that explains it.
      - name: Build frontend
        run: pnpm turbo run build --filter=@ams/web

      - name: Check frontend size budgets
        run: pnpm --filter @ams/web size:check

      - name: Build & stage network helper (required Tauri bundle resource)
        shell: bash
        run: |
          cargo build --release -p network-helper
          bin=target/release/ams-access-networkhelper
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          cp "$bin" apps/desktop/src-tauri/helpers/ams-access-networkhelper

      # Authenticode signing, if and only if a certificate has been provided.
      #
      # Unsigned is the current, deliberate state: every candidate meets
      # "Windows protected your PC" plus an administrator prompt, which is
      # scripted for invigilators in WINDOWS-INSTALL.md rather than
      # pretended away. This step exists so that turning signing on is
      # *adding two secrets*, not editing a workflow under time pressure the
      # week of a contest.
      #
      # WINDOWS_CERTIFICATE          base64 of a .pfx
      # WINDOWS_CERTIFICATE_PASSWORD its password
      #
      # Note the constraint that decides which certificate to buy: since June
      # 2023 an OV or EV key may not sit in a plain file, so a .pfx comes only
      # from a cloud signing service that exports one. Azure Trusted Signing
      # (which `bundle.windows.timestampUrl` already points at) does not work
      # this way — it needs `azure/trusted-signing-action` in place of this
      # step. Whichever is chosen, `certificateThumbprint` is what Tauri
      # actually reads, and it is injected below rather than committed.
      - name: Import signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          # The thumbprint is the handle Tauri wants; it is derived here rather
          # than stored, so rotating the certificate needs no workflow change.
          "TAURI_WINDOWS_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "signing certificate imported"

      # Imports into a throwaway keychain rather than the login one: the
      # runner is disposable, but a signing key left in the default keychain
      # is readable by every later step in the job.
      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ams-signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -f pkcs12
          # Without the partition list codesign prompts for the keychain
          # password, which on a headless runner means the job hangs rather
          # than fails.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/cert.p12"

      - name: Check Linux media packaging prerequisites
        if: runner.os == 'Linux'
        run: sh scripts/check-linux-packaging-tools.sh

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          # Tauri reads these directly: APPLE_SIGNING_IDENTITY to codesign the
          # .app, and the APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID trio to
          # notarize it. APPLE_PASSWORD is an app-specific password, not the
          # account password — a regular one fails with an unhelpful 401.
          # All six are ignored on Linux and Windows.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # No TAURI_SIGNING_PRIVATE_KEY: there is no `plugins.updater` block in
        # tauri.conf.json, so no signature was ever produced and the key was
        # decoration. There is deliberately no updater either — a proctored
        # client that can silently change itself between the readiness check
        # and the contest is a liability. The API version-gates old builds
        # instead, with a 426 naming the download.
        # `--config` overlays the thumbprint only when one exists, so an
        # unsigned build stays byte-for-byte the build it is today rather
        # than taking a different code path that is never exercised.
        shell: bash
        run: |
          if [ -n "${TAURI_WINDOWS_THUMBPRINT:-}" ]; then
            echo "signing with certificate ${TAURI_WINDOWS_THUMBPRINT}"
            overlay="{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"${TAURI_WINDOWS_THUMBPRINT}\"}}}"
            pnpm tauri build --target ${{ matrix.target }} --config "$overlay"
          else
            echo "::warning::no signing certificate — this build is UNSIGNED and will trip SmartScreen"
            pnpm tauri build --target ${{ matrix.target }}
          fi

      - name: Validate Linux package payloads
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p artifact-validation
          for format in deb rpm appimage; do
            extension="$format"
            [ "$format" != appimage ] || extension=AppImage
            packages=("target/${{ matrix.target }}/release/bundle"/"$format"/*."$extension")
            [ "${#packages[@]}" -eq 1 ] || { echo "Expected one $format artifact"; exit 1; }
            validation_args=()
            if [ "$format" = appimage ]; then
              # Reproduce linuxdeploy's exact helper RUNPATH rewrite, rather
              # than accepting a different executable by build-ID alone.
              rewriter_dir=$(mktemp -d)
              trap 'rm -rf "$rewriter_dir"' EXIT
              linuxdeploy="${XDG_CACHE_HOME:-$HOME/.cache}/tauri/linuxdeploy-x86_64.AppImage"
              (cd "$rewriter_dir" && "$linuxdeploy" --appimage-extract >/dev/null)
              validation_args=(--appimage-patchelf "$rewriter_dir/squashfs-root/usr/bin/patchelf")
            fi
            python3 scripts/validate-linux-artifact.py "${packages[0]}" "${validation_args[@]}" > "artifact-validation/$format.json"
          done

      - name: Retain Linux package validation evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-validation
          path: artifact-validation/*.json
          if-no-files-found: warn

      - name: Collect artifact paths
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          BASE="target/${TARGET}/release/bundle"
          FILES=""
          # No *.sig globs: without an updater config Tauri never produces
          # one, so they matched nothing while looking like they did.
          #
          # Linux. `rpm` is in bundle.targets and was built on every release
          # and then discarded, because it was never collected here.
          for f in "${BASE}"/appimage/*.AppImage \
                   "${BASE}"/deb/*.deb \
                   "${BASE}"/rpm/*.rpm; do
            [ -f "$f" ] && FILES="${FILES}${f}"$'\n'
          done
          # Windows
          for f in "${BASE}"/msi/*.msi \
                   "${BASE}"/nsis/*-setup.exe; do
            [ -f "$f" ] && FILES="${FILES}${f}"$'\n'
          done
          # macOS. The .dmg only — `macos/*.app.tar.gz` exists solely to feed
          # the updater, and there is no updater.
          for f in "${BASE}"/dmg/*.dmg; do
            [ -f "$f" ] && FILES="${FILES}${f}"$'\n'
          done
          echo "RELEASE_FILES<<EOF" >> "$GITHUB_ENV"
          echo "$FILES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      # Windows installers are unsigned, so SmartScreen will warn and the exe
      # asks for administrator (build.rs sets requireAdministrator). A
      # candidate has no way to tell that apart from malware except by
      # checking the hash, so publish it.
      #
      # Written to a per-target *file* and uploaded as an asset rather than
      # inlined into the release body. Each matrix job writes the body, so the
      # last one wins and the others' sums vanish — the first cut of v2.0.0
      # shipped with only the Linux hashes, under a note telling people to
      # verify the Windows installer before running it.
      #
      # Only Linux and Windows runners reach this, and both have sha256sum in
      # bash. (macOS would need `shasum -a 256`; revisit when it returns.)
      #
      # Spaces are translated to dots. The bundles are named "AMS Access_..."
      # but GitHub rewrites spaces when it stores an asset, so a manifest
      # holding the on-disk name lists files that nobody downloading from the
      # release page will ever have — `sha256sum -c` then fails on every line,
      # for everyone, while the hashes themselves are perfectly correct. The
      # name has to be the one the downloader ends up with.
      - name: Checksums
        shell: bash
        run: |
          SUMS="SHA256SUMS-${{ matrix.target }}.txt"
          : > "$SUMS"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            asset="$(basename "$file" | tr ' ' '.')"
            # macOS runners have no `sha256sum`; BSD ships `shasum`. With
            # macOS back in the matrix, hardcoding sha256sum would fail every
            # mac release at the last step, after a full build and notarize.
            if command -v sha256sum >/dev/null 2>&1; then
              digest="$(sha256sum "$file" | cut -d' ' -f1)"
            else
              digest="$(shasum -a 256 "$file" | cut -d' ' -f1)"
            fi
            printf '%s  %s\n' "$digest" "$asset" >> "$SUMS"
          done <<< "${RELEASE_FILES}"
          cat "$SUMS"
          echo "RELEASE_FILES<<EOF" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "${RELEASE_FILES}" "$SUMS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "AMS Access ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          fail_on_unmatched_files: false
          files: ${{ env.RELEASE_FILES }}
