name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Intel build cross-compiles on the arm64 runner — GitHub retired the
          # macos-13 (Intel) runners; a job pinned to that label queues for 24h
          # and gets the whole run cancelled (this killed v1.0.3 and v1.0.4).
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.target }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Turbo cache restore
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ matrix.platform }}-turbo-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ matrix.platform }}-turbo-

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: pnpm turbo run build --filter=@ams/web

      - name: Check frontend size budgets
        run: pnpm --filter @ams/web size:check

      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ams-signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build & stage network helper (required Tauri bundle resource)
        shell: bash
        run: |
          cargo build --release -p network-helper
          bin=target/release/ams-access-networkhelper
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          cp "$bin" apps/desktop/src-tauri/helpers/ams-access-networkhelper

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Collect artifact paths
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          BASE="target/${TARGET}/release/bundle"
          FILES=""
          # Linux
          for f in "${BASE}"/appimage/*.AppImage "${BASE}"/appimage/*.AppImage.sig \
                   "${BASE}"/deb/*.deb "${BASE}"/deb/*.deb.sig; do
            [ -f "$f" ] && FILES="${FILES}${f}"$'\n'
          done
          # Windows
          for f in "${BASE}"/msi/*.msi "${BASE}"/msi/*.msi.sig \
                   "${BASE}"/nsis/*-setup.exe "${BASE}"/nsis/*-setup.exe.sig; do
            [ -f "$f" ] && FILES="${FILES}${f}"$'\n'
          done
          # macOS
          for f in "${BASE}"/dmg/*.dmg \
                   "${BASE}"/macos/*.app.tar.gz "${BASE}"/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && FILES="${FILES}${f}"$'\n'
          done
          echo "RELEASE_FILES<<EOF" >> "$GITHUB_ENV"
          echo "$FILES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "AMS Access ${{ github.ref_name }}"
          body: "See CHANGELOG for details."
          fail_on_unmatched_files: false
          files: ${{ env.RELEASE_FILES }}
