name: CI

# Compiles and lints the Rust workspace on ALL shipping platforms.
#
# Rationale: platform-rs hides each OS module behind cfg_if, so a Linux-only
# check (pre-commit hook) never parses the macOS/Windows code at all. That is
# how commit 27f3950 landed with macOS code that did not compile, and how the
# Windows raw-cpuid variant-name errors went unnoticed. This matrix is the
# authoritative gate.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}
    name: Rust (${{ matrix.platform }})
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ci-${{ matrix.platform }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ci-${{ matrix.platform }}-cargo-

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      # tauri-build validates that frontendDist (apps/web/out) exists at compile
      # time. The Rust gate does not need real frontend assets — an empty dir is
      # enough and avoids a full Node/Next build on every Rust-only PR.
      - name: Create placeholder frontend dist
        shell: bash
        run: mkdir -p apps/web/out

      - name: Build & stage network helper (required Tauri bundle resource)
        shell: bash
        run: |
          cargo build --release -p network-helper
          bin=target/release/ams-access-networkhelper
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          cp "$bin" apps/desktop/src-tauri/helpers/ams-access-networkhelper

      - name: rustfmt
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  web-tests:
    runs-on: ubuntu-latest
    name: Web tests
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every package's tests, not just @ams/web. The policy-parity test lives
      # in @ams/api-client and would otherwise never run — which is exactly
      # how the Rust and TypeScript policy builders were free to drift.
      - name: Guard tests
        run: pnpm test

      - name: Versions agree
        run: pnpm check:versions

  bundle-smoke:
    # Packaging breakage only ever surfaced after a tag was pushed, which is
    # how v1.0.3, v1.0.4 and v1.1.0 all shipped broken: CI ran tests and never
    # once ran `tauri build`. This runs the real bundler and asserts an
    # installer came out, uploading nothing.
    #
    # macOS is here even though it is dropped from the release matrix — it is
    # the only thing that compiles platform-rs/src/macos/mod.rs, and dropping
    # it from both would let that code rot until the Apple agreement lands.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: "target/release/bundle/deb/*.deb"
          - platform: windows-latest
            artifact: "target/release/bundle/msi/*.msi"
          - platform: macos-latest
            # The .dmg, not the .app: Tauri moves the bundle *into* the disk
            # image and leaves `bundle/macos/` empty, so asserting on the .app
            # fails a build that in fact succeeded.
            artifact: "target/release/bundle/dmg/*.dmg"

    runs-on: ${{ matrix.platform }}
    name: Bundle smoke (${{ matrix.platform }})
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo cache restore
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ matrix.platform }}-turbo-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ matrix.platform }}-turbo-

      - name: Build frontend
        run: pnpm turbo run build --filter=@ams/web

      # A bundle resource. Without it `tauri build` fails on a missing file,
      # which is a packaging failure worth catching here rather than at a tag.
      - name: Build & stage network helper
        shell: bash
        run: |
          cargo build --release -p network-helper
          bin=target/release/ams-access-networkhelper
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          cp "$bin" apps/desktop/src-tauri/helpers/ams-access-networkhelper

      - name: Build Tauri bundle
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: An installer actually came out
        shell: bash
        run: |
          shopt -s nullglob
          found=(${{ matrix.artifact }})
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::tauri build produced no ${{ matrix.artifact }}"
            ls -R target/release/bundle || true
            exit 1
          fi
          printf 'OK %s\n' "${found[@]}"

  msix:
    # The Store build, packaged for real.
    #
    # Tauri has no MSIX target, so this is `makeappx` over a staged directory —
    # which means nothing about it is verified by the other jobs. It is a
    # separate job rather than a matrix entry on bundle-smoke because it needs
    # a *differently manifested* binary: AMS_MSIX=1 switches the embedded
    # manifest from requireAdministrator to asInvoker, and reusing the ordinary
    # build would produce a package that installs and then silently refuses to
    # launch.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    name: MSIX package
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: windows-latest-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            windows-latest-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm turbo run build --filter=@ams/web

      - name: Build & stage network helper
        shell: bash
        run: |
          cargo build --release -p network-helper
          cp target/release/ams-access-networkhelper.exe \
             apps/desktop/src-tauri/helpers/ams-access-networkhelper

      # `tauri build` rather than `cargo build`: it is what copies bundle
      # resources (the blazeface model, the helpers) into place, and the
      # packaging script stages from that output.
      - name: Build app with the asInvoker manifest
        working-directory: apps/desktop
        env:
          AMS_MSIX: "1"
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: The binary must not require elevation
        shell: pwsh
        # The failure this catches is quiet and expensive: an MSIX built around
        # a requireAdministrator binary packages cleanly, installs cleanly,
        # appears in the Start menu, and does nothing whatsoever when clicked.
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/ams-access.exe"
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($exe))
          if ($text -match "requireAdministrator") {
            Write-Error "AMS_MSIX=1 did not take effect — binary still requires elevation"
            exit 1
          }
          if ($text -notmatch "asInvoker") {
            Write-Error "no asInvoker manifest found in the binary"
            exit 1
          }
          Write-Host "OK: asInvoker"

      - name: Package MSIX
        shell: pwsh
        run: ./apps/desktop/msix/build-msix.ps1

      - name: A package actually came out, and contains what it claims
        shell: pwsh
        run: |
          $msix = Get-ChildItem target/msix -Filter *.msix | Select-Object -First 1
          if (-not $msix) { Write-Error "no .msix produced"; exit 1 }
          Write-Host "built $($msix.Name) ($([math]::Round($msix.Length/1MB,1)) MB)"

          # A package whose manifest survived substitution but whose payload is
          # missing the executable or the model would install and fail at the
          # face scan, in front of a candidate.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
          } finally {
            $zip.Dispose()
          }
          foreach ($required in @("AppxManifest.xml", "ams-access.exe",
                                  "Assets/Square150x150Logo.png")) {
            if ($names -notcontains $required) {
              Write-Error "package is missing $required"
              exit 1
            }
          }
          if (-not ($names | Where-Object { $_ -like "resources/*blazeface*" })) {
            Write-Warning "no blazeface model in the package — the face scan will fail at runtime"
          }
          Write-Host "OK: $($names.Count) entries"

      - name: Upload for inspection
        uses: actions/upload-artifact@v4
        with:
          name: msix-package
          path: target/msix/*.msix
          retention-days: 14
